const CY = DATA.cur_year;
const NOTES = {"Ford Kuga":"Eğri atipik: kayıp yaşla artıyor (PHEV/jenerasyon karması) — sweet spot güvenilir değil.",
"Nissan Qashqai":"Kayıp çok yavaş azalıyor, belirgin düzleşme yok.",
"Toyota Corolla Cross":"TR lansmanı 2022 — sadece 4 yaşlık veri var."};
const models = Object.keys(DATA.results).sort();
let cur = models.includes("Toyota Corolla Cross") ? "Toyota Corolla Cross" : models[0];
let ch1, ch2, ch3;
const sel = document.getElementById("sel");
models.forEach(m => {
  const b = document.createElement("button");
  b.textContent = m; b.onclick = () => { cur = m; render(); };
  sel.appendChild(b);
});
function fmt(n){return n.toLocaleString("tr-TR")}
function render(){
  [...sel.children].forEach(b => b.classList.toggle("active", b.textContent === cur));
  const r = DATA.results[cur];
  const ages = Object.keys(r.smooth_curve).map(Number).sort((a,b)=>a-b);
  const n = Object.values(r.counts).reduce((a,b)=>a+b,0);
  const marg = r.smooth_marginal;
  document.getElementById("kpis").innerHTML = `
    <div class="kpi"><div class="v">${r.sweet_age} yaş</div><div class="l">Optimal alım yaşı (${r.sweet_year} model) — yıllık kayıp %5 altına iniyor</div></div>
    <div class="kpi"><div class="v">%${marg[Math.min(...Object.keys(marg).map(Number))] ?? "-"}</div><div class="l">En genç yaştaki yıllık kayıp</div></div>
    <div class="kpi"><div class="v">${r.flat_age ?? "—"}</div><div class="l">Düzleşme yaşı (kayıp &lt;%3)</div></div>
    <div class="kpi"><div class="v">${fmt(n)}</div><div class="l">Temiz ilan sayısı</div></div>`;
  const mkCfg = (type, labels, datasets, yfmt) => ({type, data:{labels, datasets},
    options:{plugins:{legend:{labels:{color:"#e8ecf4"}}},
      scales:{x:{ticks:{color:"#8b96ab"},grid:{color:"#2a3550"}},
              y:{ticks:{color:"#8b96ab", callback:yfmt},grid:{color:"#2a3550"}}}}});
  if(ch1) ch1.destroy(); if(ch2) ch2.destroy(); if(ch3) ch3.destroy();
  ch1 = new Chart(document.getElementById("c1"), mkCfg("line",
    ages.map(a=>`${a}y (${CY-a})`),
    [{label:"Smooth eğri", data:ages.map(a=>r.smooth_curve[a]), borderColor:"#4f8ef7", tension:.3},
     {label:"Ham medyan", data:ages.map(a=>r.median_raw[a] ?? null), borderColor:"#8b96ab", borderDash:[5,4], tension:.2}],
    v=>(v/1e6).toFixed(1)+"M"));
  const mAges = Object.keys(marg).map(Number).sort((a,b)=>a-b);
  ch2 = new Chart(document.getElementById("c2"), mkCfg("bar",
    mAges.map(a=>`${a}y (${CY-a})`),
    [{label:"Marjinal kayıp %", data:mAges.map(a=>marg[a]),
      backgroundColor:mAges.map(a=>a===r.sweet_age?"#3ecf8e":(marg[a]>=5?"#f76c5e":"#4f8ef7"))}],
    v=>v+"%"));
  const u = DATA.usd.filter(x=>x.model===cur).sort((a,b)=>a.year-b.year);
  ch3 = new Chart(document.getElementById("c3"), mkCfg("bar",
    u.map(x=>x.year),
    [{label:"Toplam USD kaybı %", data:u.map(x=>x.total_loss_pct), backgroundColor:"#f7b84f"},
     {label:"Yıllık (bileşik) %", data:u.map(x=>x.annual_loss_pct), backgroundColor:"#4f8ef7"}],
    v=>v+"%"));
  document.getElementById("tbl").innerHTML = u.length ?
    `<table><tr><th>Yıl</th><th>Sıfır $</th><th>Bugün 2.el $</th><th>Toplam %</th><th>Yıllık %</th><th>n</th></tr>` +
    u.map(x=>`<tr><td>${x.year}</td><td>${fmt(x.new_usd)}</td><td>${fmt(x.used_usd_today)}</td><td>${x.total_loss_pct}</td><td>${x.annual_loss_pct}</td><td>${x.n}</td></tr>`).join("") + "</table>"
    : "<em style='color:#8b96ab'>Bu model için güvenilir arşiv sıfır fiyatı bulunamadı.</em>";
  document.getElementById("note").innerHTML = "<b>Not:</b> " + (NOTES[cur] ?? "Eğri, yaşına göre tipik km'li araç içindir. Jenerasyon değişimleri smooth eğriyle kısmen emilir.") +
    " Sıfır fiyatlar Wayback arşivinden yaklaşık değerlerdir (fiyat aralığı orta noktası).";
}
render();
